[package]
name = "optic-rift"
version = "0.1.0"
description = "A local-first image and video creative studio"
authors = ["MythologIQ"]
edition = "2021"

[lib]
name = "optic_rift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

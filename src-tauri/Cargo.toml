[package]
name = "optic-rift"
version = "0.1.0"
description = "A local-first image and video creative studio"
authors = ["MythologIQ"]
edition = "2021"

[lib]
name = "optic_rift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-opener = "2"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"

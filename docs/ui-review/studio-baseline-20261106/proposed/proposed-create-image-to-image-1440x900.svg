<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <title>Proposed Studio "Create" workspace, image to image, 1440x900 (wireframe, not a visual design)</title>
  <rect width="1440" height="900" fill="#0f1524"/>
  <rect x="0" y="0" width="208" height="900" fill="#111827" stroke="#273149"/>
  <text x="24" y="44" fill="#e6ecff" font-size="18" font-weight="700">OPTIC RIFT</text>
  <rect x="14" y="190" width="180" height="48" rx="10" fill="#26304a"/>
  <text x="40" y="220" fill="#ffffff" font-size="15" font-weight="700">Studio</text>
  <rect x="208" y="0" width="1232" height="64" fill="#121a2b" stroke="#273149"/>
  <rect x="236" y="14" width="236" height="36" rx="18" fill="#1b2438" stroke="#3a4766"/>
  <rect x="240" y="18" width="114" height="28" rx="14" fill="#8ea5ff"/>
  <text x="270" y="37" fill="#0f1524" font-size="13" font-weight="700">Create</text>
  <text x="384" y="37" fill="#c9d6ff" font-size="13">Edit media</text>
  <!-- stage: source and result side by side -->
  <rect x="232" y="84" width="852" height="600" rx="14" fill="#0a0f1c" stroke="#33405c"/>
  <text x="252" y="112" fill="#c4cfe5" font-size="13" font-weight="700">G  Starting image → result (same size, never cropped)</text>
  <rect x="252" y="128" width="380" height="380" rx="8" fill="#1d2b44" stroke="#4a5d86"/>
  <text x="330" y="310" fill="#c9d6ff" font-size="15" font-weight="700">Starting image</text>
  <text x="300" y="332" fill="#93a3c2" font-size="12">unchanged original · job 8409925c</text>
  <text x="646" y="322" fill="#8ea5ff" font-size="28">→</text>
  <rect x="684" y="128" width="380" height="380" rx="8" fill="#1d2b44" stroke="#8ea5ff" stroke-width="2"/>
  <text x="790" y="310" fill="#e6ecff" font-size="15" font-weight="700">Result</text>
  <text x="730" y="332" fill="#93a3c2" font-size="12">strength 0.65 · 25 steps → 16 denoising</text>
  <rect x="252" y="524" width="812" height="40" rx="10" fill="#151d30" stroke="#33405c"/>
  <text x="268" y="549" fill="#e6ecff" font-size="13">Compare: side by side | slider · Open result in editor · Use result as next start · Save copy</text>
  <text x="252" y="600" fill="#7f8db0" font-size="12">Before a result exists the right frame shows the progress overlay; a previous text-to-image result is never shown here.</text>
  <!-- prompt bar -->
  <rect x="232" y="700" width="852" height="96" rx="14" fill="#151d30" stroke="#4a5d86"/>
  <text x="252" y="726" fill="#c4cfe5" font-size="12" font-weight="700">Describe the change</text>
  <rect x="252" y="734" width="610" height="48" rx="8" fill="#20293e" stroke="#3a455f"/>
  <text x="266" y="764" fill="#93a3c2" font-size="14">the same fox reading by candlelight at night, deep blue tones</text>
  <rect x="876" y="734" width="190" height="48" rx="10" fill="#8ea5ff"/>
  <text x="904" y="764" fill="#0f1524" font-size="16" font-weight="800">Transform</text>
  <!-- filmstrip as source picker -->
  <rect x="232" y="812" width="852" height="76" rx="12" fill="#121a2b" stroke="#273149"/>
  <text x="248" y="832" fill="#c4cfe5" font-size="12" font-weight="700">H  Pick a starting image from thumbnails (replaces the text dropdown)</text>
  <g fill="#26304a" stroke="#3a4766">
    <rect x="248" y="840" width="40" height="40" rx="5" stroke="#8ea5ff" stroke-width="3"/><rect x="296" y="840" width="40" height="40" rx="5"/><rect x="344" y="840" width="40" height="40" rx="5"/><rect x="392" y="840" width="40" height="40" rx="5"/><rect x="440" y="840" width="40" height="40" rx="5"/>
  </g>
  <!-- settings -->
  <rect x="1104" y="84" width="316" height="804" rx="14" fill="#151b2b" stroke="#273149"/>
  <text x="1124" y="114" fill="#ffffff" font-size="15" font-weight="700">Settings</text>
  <rect x="1124" y="156" width="276" height="34" rx="8" fill="#20293e" stroke="#3a455f"/>
  <text x="1146" y="178" fill="#c9d6ff" font-size="13">Text to image</text>
  <rect x="1262" y="158" width="136" height="30" rx="7" fill="#8ea5ff"/><text x="1276" y="178" fill="#0f1524" font-size="13" font-weight="700">Image to image</text>
  <text x="1124" y="220" fill="#c4cfe5" font-size="13" font-weight="700">Change strength 0.65</text>
  <rect x="1124" y="232" width="276" height="6" rx="3" fill="#3a455f"/><circle cx="1303" cy="235" r="9" fill="#8ea5ff"/>
  <text x="1124" y="262" fill="#93a3c2" font-size="12">Lower keeps more of the starting image</text>
  <text x="1124" y="300" fill="#c4cfe5" font-size="13" font-weight="700">Model</text>
  <rect x="1124" y="308" width="276" height="34" rx="8" fill="#20293e" stroke="#3a455f"/><text x="1136" y="330" fill="#e6ecff" font-size="13">segmind/SSD-1B · Ready</text>
  <text x="1124" y="368" fill="#93a3c2" font-size="12">Output size follows the starting image (1024 × 1024)</text>
  <rect x="1124" y="388" width="276" height="36" rx="8" fill="#1b2438" stroke="#3a4766"/><text x="1136" y="411" fill="#c9d6ff" font-size="13">▸ Advanced: steps, guidance, seed</text>
  <text x="1124" y="456" fill="#7f8db0" font-size="12">Invalid step × strength combinations are</text>
  <text x="1124" y="474" fill="#7f8db0" font-size="12">explained here and disable Transform (as today).</text>
</svg>

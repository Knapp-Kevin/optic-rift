<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Arial, sans-serif">
  <title>Proposed Studio "Create" workspace, text to image, 1440x900 (wireframe, not a visual design)</title>
  <rect width="1440" height="900" fill="#0f1524"/>
  <!-- existing app navigation, unchanged -->
  <rect x="0" y="0" width="208" height="900" fill="#111827" stroke="#273149"/>
  <text x="24" y="44" fill="#e6ecff" font-size="18" font-weight="700">OPTIC RIFT</text>
  <text x="24" y="160" fill="#c9d6ff" font-size="15">Projects</text>
  <rect x="14" y="190" width="180" height="48" rx="10" fill="#26304a"/>
  <text x="40" y="220" fill="#ffffff" font-size="15" font-weight="700">Studio</text>
  <text x="24" y="275" fill="#c9d6ff" font-size="15">Models</text>
  <text x="24" y="330" fill="#c9d6ff" font-size="15">Settings</text>
  <!-- top bar with Studio workspace switch -->
  <rect x="208" y="0" width="1232" height="64" fill="#121a2b" stroke="#273149"/>
  <rect x="236" y="14" width="236" height="36" rx="18" fill="#1b2438" stroke="#3a4766"/>
  <rect x="240" y="18" width="114" height="28" rx="14" fill="#8ea5ff"/>
  <text x="270" y="37" fill="#0f1524" font-size="13" font-weight="700">Create</text>
  <text x="384" y="37" fill="#c9d6ff" font-size="13">Edit media</text>
  <text x="496" y="37" fill="#7f8db0" font-size="12">A  Studio switch: Create = generation, Edit = today's media editor and timeline (unchanged)</text>
  <!-- centre stage -->
  <rect x="232" y="84" width="852" height="600" rx="14" fill="#0a0f1c" stroke="#33405c"/>
  <rect x="408" y="104" width="500" height="500" rx="8" fill="#1d2b44" stroke="#4a5d86" stroke-dasharray="6 4"/>
  <text x="520" y="350" fill="#c9d6ff" font-size="16" font-weight="700">Generated image (fit, never cropped)</text>
  <text x="520" y="374" fill="#93a3c2" font-size="13">~500 px tall at 1440x900, ~760 px at 1920x1080</text>
  <rect x="533" y="402" width="250" height="34" rx="17" fill="#121a2b" opacity="0.9" stroke="#8ea5ff"/>
  <text x="552" y="424" fill="#e6ecff" font-size="13">B  Generating, step 12 of 25 [Cancel]</text>
  <rect x="408" y="618" width="500" height="44" rx="10" fill="#151d30" stroke="#33405c"/>
  <text x="424" y="645" fill="#e6ecff" font-size="13">C  Open in editor · Use as starting image · Save copy (may sync) · Details</text>
  <!-- prompt bar -->
  <rect x="232" y="700" width="852" height="96" rx="14" fill="#151d30" stroke="#4a5d86"/>
  <text x="252" y="726" fill="#c4cfe5" font-size="12" font-weight="700">D  Prompt (always visible)</text>
  <rect x="252" y="734" width="610" height="48" rx="8" fill="#20293e" stroke="#3a455f"/>
  <text x="266" y="764" fill="#93a3c2" font-size="14">a watercolor fox reading a book in a cozy library, warm light</text>
  <rect x="876" y="734" width="190" height="48" rx="10" fill="#8ea5ff"/>
  <text x="914" y="764" fill="#0f1524" font-size="16" font-weight="800">Generate</text>
  <!-- filmstrip -->
  <rect x="232" y="812" width="852" height="76" rx="12" fill="#121a2b" stroke="#273149"/>
  <text x="248" y="832" fill="#c4cfe5" font-size="12" font-weight="700">E  Recent generations (thumbnails, newest first, survives restart)</text>
  <g fill="#26304a" stroke="#3a4766">
    <rect x="248" y="840" width="40" height="40" rx="5"/><rect x="296" y="840" width="40" height="40" rx="5"/><rect x="344" y="840" width="40" height="40" rx="5"/><rect x="392" y="840" width="40" height="40" rx="5"/><rect x="440" y="840" width="40" height="40" rx="5"/><rect x="488" y="840" width="40" height="40" rx="5"/><rect x="536" y="840" width="40" height="40" rx="5"/>
  </g>
  <text x="596" y="866" fill="#7f8db0" font-size="12">Click = show in stage · badge marks "transformed from"</text>
  <!-- settings panel -->
  <rect x="1104" y="84" width="316" height="804" rx="14" fill="#151b2b" stroke="#273149"/>
  <text x="1124" y="114" fill="#ffffff" font-size="15" font-weight="700">F  Settings (own scroll, collapsible)</text>
  <text x="1124" y="148" fill="#c4cfe5" font-size="13" font-weight="700">Mode</text>
  <rect x="1124" y="156" width="276" height="34" rx="8" fill="#20293e" stroke="#3a455f"/>
  <rect x="1126" y="158" width="136" height="30" rx="7" fill="#8ea5ff"/><text x="1146" y="178" fill="#0f1524" font-size="13" font-weight="700">Text to image</text>
  <text x="1280" y="178" fill="#c9d6ff" font-size="13">Image to image</text>
  <text x="1124" y="216" fill="#c4cfe5" font-size="13" font-weight="700">Model</text>
  <rect x="1124" y="224" width="276" height="34" rx="8" fill="#20293e" stroke="#3a455f"/><text x="1136" y="246" fill="#e6ecff" font-size="13">segmind/SSD-1B · Ready</text>
  <text x="1124" y="284" fill="#c4cfe5" font-size="13" font-weight="700">Size</text>
  <rect x="1124" y="292" width="276" height="34" rx="8" fill="#20293e" stroke="#3a455f"/><text x="1136" y="314" fill="#e6ecff" font-size="13">Square 1024 × 1024</text>
  <text x="1124" y="352" fill="#c4cfe5" font-size="13" font-weight="700">Avoid (optional)</text>
  <rect x="1124" y="360" width="276" height="34" rx="8" fill="#20293e" stroke="#3a455f"/>
  <rect x="1124" y="410" width="276" height="36" rx="8" fill="#1b2438" stroke="#3a4766"/><text x="1136" y="433" fill="#c9d6ff" font-size="13">▸ Advanced: steps, guidance, seed</text>
  <rect x="1124" y="462" width="276" height="96" rx="8" fill="#16243a" stroke="#3c5180"/>
  <text x="1136" y="486" fill="#e6ecff" font-size="13" font-weight="700">GPU</text>
  <text x="1136" y="508" fill="#93a3c2" font-size="12">RTX · 13.9 GB free · model loaded</text>
  <text x="1136" y="528" fill="#93a3c2" font-size="12">Busy/confirm/block messages appear here</text>
  <text x="1136" y="546" fill="#93a3c2" font-size="12">and in the stage, not below the fold.</text>
  <text x="1124" y="590" fill="#7f8db0" font-size="12">Privacy and lineage notes: one "ⓘ" line</text>
  <text x="1124" y="608" fill="#7f8db0" font-size="12">each, expandable (text kept, not removed).</text>
</svg>
